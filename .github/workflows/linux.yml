name: Linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install Dependencies
        run: |
          # arg!
          sudo apt-get install -y fontconfig-config
          sudo apt-get install -y libfontconfig
          sudo apt-get install -y libfontconfig
          sudo apt-get install -y libfontconfig-dev
          sudo apt-get install -y libfontconfig1-dev

          sudo apt-get install -y locate libharfbuzz-dev
          sudo apt-get install -y fonts-freefont-otf
          sudo apt-get install -y fonts-freefont-ttf
          zef install --/test --test-depends --deps-only .
      - name: Run Tests and install
        run: zef install --test .
